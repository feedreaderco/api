# Test cases for feed processing functions
# These values are generated using the actual Node.js implementation

hash_function_tests:
  - description: "Hash function with XKCD article GUID"
    input:
      guid: "https://xkcd.com/3153/"
    expected: "13a0bebeed5b348147d880a1a4917587"

  - description: "Hash function with different GUID"
    input:
      guid: "https://xkcd.com/3152/"
    expected: "21664da7ee05988c62d1f516f3442411"

  - description: "Hash function with empty GUID"
    input:
      guid: ""
    expected: "d41d8cd98f00b204e9800998ecf8427e"

score_function_tests:
  - description: "Score with pubDate"
    input:
      pubDate: "2024-10-10T00:00:00Z"
    expected: 1728518400000

  - description: "Score with alternative date field 'pubdate'"
    input:
      pubdate: "2024-10-08T00:00:00Z"
    expected: 1728345600000

  - description: "Score with alternative date field 'date'"
    input:
      date: "2024-10-06T00:00:00Z"
    expected: 1728172800000

  - description: "Score with invalid date falls back to Date.now()"
    input:
      pubDate: "invalid-date"
    expected_type: "timestamp"  # Will be current timestamp

request_headers_tests:
  - description: "Headers with no stored feed data"
    input: {}
    expected:
      user-agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_8_5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/31.0.1650.63 Safari/537.36"

  - description: "Headers with lastModified"
    input:
      lastModified: "Wed, 09 Oct 2024 12:00:00 GMT"
    expected:
      user-agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_8_5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/31.0.1650.63 Safari/537.36"
      If-Modified-Since: "Wed, 09 Oct 2024 12:00:00 GMT"

  - description: "Headers with etag"
    input:
      etag: "\"abc123\""
    expected:
      user-agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_8_5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/31.0.1650.63 Safari/537.36"
      If-None-Match: "\"abc123\""

  - description: "Headers with both lastModified and etag"
    input:
      lastModified: "Wed, 09 Oct 2024 12:00:00 GMT"
      etag: "\"abc123\""
    expected:
      user-agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_8_5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/31.0.1650.63 Safari/537.36"
      If-Modified-Since: "Wed, 09 Oct 2024 12:00:00 GMT"
      If-None-Match: "\"abc123\""

redis_keys_tests:
  - description: "Build Redis keys for XKCD feed"
    input: "https://xkcd.com/atom.xml"
    expected:
      feedKey: "feed:https://xkcd.com/atom.xml"
      articlesKey: "articles:https://xkcd.com/atom.xml"

  - description: "Build Redis keys for HN feed"
    input: "https://news.ycombinator.com/rss"
    expected:
      feedKey: "feed:https://news.ycombinator.com/rss"
      articlesKey: "articles:https://news.ycombinator.com/rss"

article_storage_tests:
  - description: "Should store new article (oldScore is null)"
    input:
      oldScore: null
      newScore: 1728518400000
    expected: true

  - description: "Should store article with changed score"
    input:
      oldScore: 1728518400000
      newScore: 1728604800000
    expected: true

  - description: "Should NOT store article with same score"
    input:
      oldScore: 1728518400000
      newScore: 1728518400000
    expected: false

  - description: "Should store article when old score differs (string vs number)"
    input:
      oldScore: "1728518400000"
      newScore: 1728518400001
    expected: true

article_validation_tests:
  - description: "Valid article with all required fields"
    input:
      guid: "https://example.com/article1"
      description: "Article description"
      title: "Article Title"
    expected: true

  - description: "Invalid article missing guid"
    input:
      description: "Article description"
      title: "Article Title"
    expected: false

  - description: "Invalid article missing description"
    input:
      guid: "https://example.com/article1"
      title: "Article Title"
    expected: false

  - description: "Invalid article is null"
    input: null
    expected: false

redis_key_prefix_tests:
  - description: "Redis feed prefix constant"
    key: "REDIS_FEED_PREFIX"
    expected: "feed:"

  - description: "Redis articles prefix constant"
    key: "REDIS_ARTICLES_PREFIX"
    expected: "articles:"

  - description: "Redis article prefix constant"
    key: "REDIS_ARTICLE_PREFIX"
    expected: "article:"

build_article_key_tests:
  - description: "Build article key with hash"
    input: "13a0bebeed5b348147d880a1a4917587"
    expected: "article:13a0bebeed5b348147d880a1a4917587"

  - description: "Build article key with different hash"
    input: "21664da7ee05988c62d1f516f3442411"
    expected: "article:21664da7ee05988c62d1f516f3442411"

process_article_tests:
  - description: "Process article adds hash, score, and feedurl"
    input:
      article:
        guid: "https://xkcd.com/3153/"
        title: "Test Article"
        pubDate: "2024-10-10T00:00:00Z"
      feedURI: "https://xkcd.com/atom.xml"
    expected:
      guid: "https://xkcd.com/3153/"
      title: "Test Article"
      pubDate: "2024-10-10T00:00:00Z"
      hash: "13a0bebeed5b348147d880a1a4917587"
      score: 1728518400000
      feedurl: "https://xkcd.com/atom.xml"

extract_article_ids_tests:
  - description: "Extract article IDs from Redis keys"
    input:
      - "article:13a0bebeed5b348147d880a1a4917587"
      - "article:21664da7ee05988c62d1f516f3442411"
      - "article:3fa08ba1591ba3683e87265ee9300946"
    expected:
      - "13a0bebeed5b348147d880a1a4917587"
      - "21664da7ee05988c62d1f516f3442411"
      - "3fa08ba1591ba3683e87265ee9300946"

generate_article_body_tests:
  - description: "Generate JSON body for article"
    input:
      guid: "test-guid"
      title: "Test Article"
      hash: "abc123"
      score: 1234567890
    expected_json: true  # Test should verify valid JSON and round-trip
